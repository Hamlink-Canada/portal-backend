[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-backend"
version = "0.1.0"
description = "Backend service for generic Portal deployments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "Authlib>=1.9.5,<2",
  "apispec>=6.8,<7",
  "Flask>=3.1.3,<4",
  "flask-smorest>=0.47,<0.48",
  "gunicorn>=23,<24",
  "marshmallow>=4,<5",
  "SQLAlchemy>=2.1.8,<2.2",
  "alembic>=1.20.1,<2",
  "coordinates2country>=1.0.9,<2",
  "dynaconf>=3.3.5,<4",
  "rpt-common[postgres] @ git+https://github.com/Hamlink-Canada/pyCommon.git@main",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30,<2",
  "opentelemetry-distro>=0.51b0",
  "opentelemetry-instrumentation-flask>=0.51b0",
  "opentelemetry-instrumentation-urllib>=0.51b0",
  "opentelemetry-instrumentation-system-metrics>=0.51b0",
  "opentelemetry-instrumentation-logging>=0.51b0",
]

[project.scripts]
portal-admin = "portal_backend.admin_cli:main"
portal-migrate = "portal_backend.migrate_cli:main"

[dependency-groups]
dev = ["pytest>=9.2,<10", "ruff>=0.17.4,<0.18", "build>=1.6,<2"]

[tool.uv.sources]
rpt-common = { path = "../pyCommon", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portal_backend = ["sitecodes.json"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
